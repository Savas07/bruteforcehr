name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml's `verify` job: a release ships only what passes the full CI.
  workflow_call:

permissions:
  contents: read

# Superseded PR runs are cancelled; every push to main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # @bfhr/cv-render's ATS round trip prints PDFs in headless Chromium (docs/adr/0009-cv-rendering.md).
      - run: pnpm --filter @bfhr/cv-render exec playwright install --with-deps chromium-headless-shell
      - run: pnpm turbo run lint typecheck test

  swift:
    name: BFHRCore (swift test)
    runs-on: ubuntu-latest
    # Official Swift image matching Xcode 26.6's toolchain. swift-actions/setup-swift's latest
    # release (v2.4.0) only knows Swift ≤ 6.2.1; its v3 (swiftly-based) is still a beta.
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v7
      # Replays packages/core/conformance and packages/fixtures/conformance (committed; the check job
      # fails when they are stale).
      - run: swift test --package-path packages/swift/BFHRCore

  rules:
    name: Security rules (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable pnpm
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bfhr/firebase-rules-tests run test:rules

  security:
    name: Secret scan + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm audit --prod --audit-level high
