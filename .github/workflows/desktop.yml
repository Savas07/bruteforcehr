name: Desktop

# Public repo: GitHub-hosted runners are free, so this runs whenever desktop code or its
# dependencies change (ADR 0004 amendment), plus on demand.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/desktop/**
      - packages/**
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      design_capture:
        description: "Only capture the design build in the real macOS and Windows apps (final critique rounds)"
        type: boolean
        default: false
      screens:
        description: "design_capture: BFHR_SCREENS (comma-separated, or none)"
        type: string
        default: today,job-detail,cv-editor,tracker-board,mail-review
      states:
        description: "design_capture: BFHR_STATES (comma-separated)"
        type: string
        default: populated,empty
      update_states:
        description: "design_capture: BFHR_UPDATE_STATES (all, comma-separated, or empty)"
        type: string
        default: ""
      auth_states:
        description: "design_capture: BFHR_AUTH_STATES (all, comma-separated, or empty)"
        type: string
        default: ""
      locale:
        description: "design_capture: BFHR_LOCALE (en, tr, de)"
        type: string
        default: en

permissions:
  contents: read

# Superseded PR runs are cancelled; every push to main keeps its own result.
concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  CARGO_TERM_COLOR: always
  # Same toolchain as local development (docs: kickoff, Rust 1.99.1 stable).
  RUST_TOOLCHAIN: "1.99.1"

defaults:
  run:
    shell: bash
    working-directory: apps/desktop

jobs:
  desktop:
    name: Build, E2E + screenshots (${{ matrix.os }})
    if: ${{ !inputs.design_capture }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
        working-directory: .
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        working-directory: .

      # Tauri's system dependencies: Xcode command-line tools (macOS) and MSVC + WebView2
      # (Windows) are preinstalled on the hosted runners; the Tauri CLI downloads NSIS itself.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Rust format, lint, unit tests
        run: |
          pnpm format:rust
          pnpm lint:rust
          pnpm test:rust

      # Production bundles: macOS .app + .dmg, Windows NSIS (x64), unsigned. Without the updater's
      # signatures: the private key is a release-only secret (release.yml builds the signed ones).
      - name: Bundle
        run: |
          flags=(--config src-tauri/tauri.unsigned.conf.json)
          # macOS: actool crashes on the .icon when tauri starts it on the runners; precompile
          # Assets.car (scripts/compile-app-icon.sh).
          if [ "$RUNNER_OS" = macOS ]; then flags+=(--config "$(scripts/compile-app-icon.sh "$RUNNER_TEMP/app-icon")"); fi
          pnpm bundle "${flags[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-bundle-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # Test build (cargo feature `e2e`): replaces the release binary, after the bundles are built.
      # macOS: bundled and installed in /Applications, so LaunchServices delivers `bruteforcehr://`
      # sign-in links to it (e2e/specs/auth.e2e.ts); Windows registers the scheme for the test
      # binary at launch (src-tauri/src/main.rs).
      - name: Build E2E app
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            pnpm tauri build --features e2e --bundles app --config src-tauri/tauri.e2e.conf.json \
              --config src-tauri/tauri.unsigned.conf.json --config "$(scripts/compile-app-icon.sh "$RUNNER_TEMP/app-icon-e2e")"
            built=src-tauri/target/release/bundle/macos/BruteForceHR.app
            app=/Applications/BruteForceHR.app
            rm -rf "$app"
            ditto "$built" "$app"
            lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
            "$lsregister" -u "$built" || true
            "$lsregister" -f "$app"
            echo "BFHR_APP_BINARY=$app/Contents/MacOS/$(defaults read "$app/Contents/Info" CFBundleExecutable)" >> "$GITHUB_ENV"
          else
            pnpm build:e2e
          fi
      # Sign-in runs against the Firebase Auth emulator (scripts/with-auth-emulator.sh).
      - run: scripts/with-auth-emulator.sh pnpm test:e2e
      # windows-latest has a 1024×768 display that Set-DisplayResolution can't change (run
      # 39797339032), so Windows captures are zoomed out to 75 % / 50 % (e2e/capture/capture.e2e.ts).
      - run: scripts/with-auth-emulator.sh pnpm capture
        if: success() || failure()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-screens-${{ matrix.os }}
          path: artifacts/screens/desktop/
          if-no-files-found: ignore
          retention-days: 14

  # On demand (`gh workflow run desktop.yml -f design_capture=true [-f update_states=all …]`): the
  # design build (fixtures, forced states) in the real macOS and Windows apps, for the final
  # critique rounds.
  design-capture:
    name: Design captures (${{ matrix.os }})
    if: ${{ inputs.design_capture }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
        working-directory: .
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm build:e2e:design
      # Windows' 1024×768 display: 1280×800 is captured at 75 % zoom and 1920×1080 at 50 % (e2e/capture/helpers.ts).
      - run: pnpm capture:app:design
        env:
          BFHR_SCREENS: ${{ inputs.screens }}
          BFHR_STATES: ${{ inputs.states }}
          BFHR_UPDATE_STATES: ${{ inputs.update_states }}
          BFHR_AUTH_STATES: ${{ inputs.auth_states }}
          BFHR_LOCALE: ${{ inputs.locale }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-design-screens-${{ matrix.os }}
          path: artifacts/screens/desktop/*/design/
          if-no-files-found: error
          retention-days: 14
