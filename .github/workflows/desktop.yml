name: Desktop

# Private repo on GitHub Free: macOS minutes count ×10 and Windows ×2 against 2,000 min/month
# (docs/runbooks/release.md "Actions minutes"), so this runs only when the desktop app or a package
# it bundles changes, on demand, and as release.yml's `verify-desktop`.
on:
  push:
    branches: [main]
    paths: &desktop-paths
      - apps/desktop/**
      - packages/core/**
      - packages/api/**
      - packages/cv-render/**
      - packages/ui-tokens/**
      - packages/fixtures/**
      - .github/workflows/desktop.yml
  pull_request:
    paths: *desktop-paths
  # release.yml `verify-desktop`: the E2E job only (design_capture is unset).
  workflow_call:
  workflow_dispatch:
    inputs:
      design_capture:
        description: "Only capture the design build in the real macOS and Windows apps (final critique rounds)"
        type: boolean
        default: false
      screens:
        description: "design_capture: BFHR_SCREENS (comma-separated, or none)"
        type: string
        default: today,job-detail,cv-editor,tracker-board,mail-review
      states:
        description: "design_capture: BFHR_STATES (comma-separated)"
        type: string
        default: populated,empty
      update_states:
        description: "design_capture: BFHR_UPDATE_STATES (all, comma-separated, or empty)"
        type: string
        default: ""
      auth_states:
        description: "design_capture: BFHR_AUTH_STATES (all, comma-separated, or empty)"
        type: string
        default: ""
      locale:
        description: "design_capture: BFHR_LOCALE (en, tr, de)"
        type: string
        default: en

permissions:
  contents: read

# Superseded PR runs are cancelled; every push to main keeps its own result.
concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  CARGO_TERM_COLOR: always
  # Same toolchain as local development (docs: kickoff, Rust 1.99.1 stable).
  RUST_TOOLCHAIN: "1.99.1"

defaults:
  run:
    shell: bash
    working-directory: apps/desktop

jobs:
  desktop:
    name: Build, E2E + screenshots (${{ matrix.os }})
    if: ${{ !inputs.design_capture }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
        working-directory: .
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        working-directory: .

      # Tauri's system dependencies: Xcode command-line tools (macOS) and MSVC + WebView2
      # (Windows) are preinstalled on the hosted runners; the Tauri CLI downloads NSIS itself.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Rust format, lint, unit tests
        run: |
          pnpm format:rust
          pnpm lint:rust
          pnpm test:rust

      # Production bundles: macOS .app + .dmg, Windows NSIS (x64), unsigned. Without the updater's
      # signatures: the private key is a release-only secret (release.yml builds the signed ones).
      - name: Bundle
        run: |
          flags=(--config src-tauri/tauri.unsigned.conf.json)
          # macOS: actool crashes on the .icon when tauri starts it on the runners; precompile
          # Assets.car (scripts/compile-app-icon.sh).
          if [ "$RUNNER_OS" = macOS ]; then flags+=(--config "$(scripts/compile-app-icon.sh "$RUNNER_TEMP/app-icon")"); fi
          pnpm bundle "${flags[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-bundle-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # Test build (cargo feature `e2e`): replaces the release binary, after the bundles are built.
      # macOS: bundled and installed in /Applications, so LaunchServices delivers `bruteforcehr://`
      # sign-in links to it (e2e/specs/auth.e2e.ts); Windows registers the scheme for the test
      # binary at launch (src-tauri/src/main.rs).
      - name: Build E2E app
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            pnpm tauri build --features e2e --bundles app --config src-tauri/tauri.e2e.conf.json \
              --config src-tauri/tauri.unsigned.conf.json --config "$(scripts/compile-app-icon.sh "$RUNNER_TEMP/app-icon-e2e")"
            built=src-tauri/target/release/bundle/macos/BruteForceHR.app
            app=/Applications/BruteForceHR.app
            rm -rf "$app"
            ditto "$built" "$app"
            lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
            "$lsregister" -u "$built" || true
            "$lsregister" -f "$app"
            echo "BFHR_APP_BINARY=$app/Contents/MacOS/$(defaults read "$app/Contents/Info" CFBundleExecutable)" >> "$GITHUB_ENV"
          else
            pnpm build:e2e
          fi
      # Specs run against the Firebase Auth, Firestore, Storage (and, for test:e2e, Functions) emulators
      # (scripts/with-emulators.sh) from a global firebase-tools, so they start within the script's
      # wait. Firestore and Storage emulators run on Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --global --no-fund --no-audit firebase-tools@15.34.1
      # Exports skip the Save dialog in test builds and land here (src-tauri/src/export_file.rs).
      - run: echo "BFHR_E2E_EXPORT_DIR=$RUNNER_TEMP/exports" >> "$GITHUB_ENV"
      # Functions too: the mail spec needs the `mailMessageReviewed` trigger (e2e/specs/mail.e2e.ts).
      - run: scripts/with-emulators.sh pnpm test:e2e
        env:
          BFHR_EMULATORS: auth,firestore,storage,functions
      # windows-latest has a 1024×768 display that Set-DisplayResolution can't change (run
      # 39797339032), so Windows captures are zoomed out to 75 % / 50 % (e2e/capture/capture.e2e.ts).
      - run: scripts/with-emulators.sh pnpm capture
        if: success() || failure()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-screens-${{ matrix.os }}
          path: artifacts/screens/desktop/
          if-no-files-found: ignore
          retention-days: 14

      # Performance budgets (docs/BRIEF.md §9, docs/runbooks/performance.md). Cold start: a session
      # spec signs in and seeds data, then the test build is launched 5 times (after a warm-up) and
      # timed until Today is interactive; the median must stay under 2.5 s. The macOS runner (a
      # virtual machine without a GPU) gets the runbook's CI slack factor: the same build's median
      # varied 2.39–3.48 s between runs there, and the webview alone takes ~1.5 s to start.
      - name: Cold-start budget
        if: success() || failure()
        run: |
          scale=1
          if [ "$RUNNER_OS" = macOS ]; then scale=1.5; fi
          scripts/with-emulators.sh pnpm perf:cold-start --runs 5 --budget-scale "$scale"
      # Scrolling: 5,000 jobs and 1,000 applications in the design build, in the engine of each
      # platform's webview (WebKit ≈ WKWebView on macOS, Chromium ≈ WebView2 on Windows). On the
      # macOS runner the slack factor only lifts the long-task limit (to 100 ms): its idle page
      # already shows stalls (runbook); frames must still drop under 5 % of the time.
      - name: Scrolling budget
        if: success() || failure()
        run: |
          engine=chromium
          scale=1
          if [ "$RUNNER_OS" = macOS ]; then engine=webkit; scale=2; fi
          pnpm exec playwright install "$engine"
          pnpm perf:scroll --engines "$engine" --budget-scale "$scale"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-perf-${{ matrix.os }}
          path: artifacts/perf/
          if-no-files-found: ignore
          retention-days: 30

  # On demand (`gh workflow run desktop.yml -f design_capture=true [-f update_states=all …]`): the
  # design build (fixtures, forced states) in the real macOS and Windows apps, for the final
  # critique rounds.
  design-capture:
    name: Design captures (${{ matrix.os }})
    if: ${{ inputs.design_capture }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
        working-directory: .
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm build:e2e:design
      # Windows' 1024×768 display: 1280×800 is captured at 75 % zoom and 1920×1080 at 50 % (e2e/capture/helpers.ts).
      - run: pnpm capture:app:design
        env:
          BFHR_SCREENS: ${{ inputs.screens }}
          BFHR_STATES: ${{ inputs.states }}
          BFHR_UPDATE_STATES: ${{ inputs.update_states }}
          BFHR_AUTH_STATES: ${{ inputs.auth_states }}
          BFHR_LOCALE: ${{ inputs.locale }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-design-screens-${{ matrix.os }}
          path: artifacts/screens/desktop/*/design/
          if-no-files-found: error
          retention-days: 14
