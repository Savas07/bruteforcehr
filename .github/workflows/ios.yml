name: iOS

# BFHRUI (SwiftUI, macOS-only) and the app target. BFHRCore runs on Linux in ci.yml; this catches
# what that can't: UI-package compile/test failures and a broken app or Share Extension build.
# Path-filtered: macOS minutes count 10x on a private repo (docs/runbooks/release.md "Actions minutes").
on:
  push:
    branches: [main]
    paths: &ios-paths
      - apps/ios/**
      - packages/swift/**
      - packages/core/conformance/**
      - packages/fixtures/conformance/**
      - packages/cv-render/**
      - .github/workflows/ios.yml
  pull_request:
    paths: *ios-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  ios:
    name: BFHRUI (swift test) + app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version
      - run: swift test --package-path packages/swift/BFHRUI
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      # The app bundles cv-render's JavaScriptCore build (its Xcode phase fails if it's missing or stale).
      - run: pnpm --filter @bfhr/cv-render build
      - name: Build app + Share Extension (simulator, unsigned)
        run: |
          xcodebuild build -project apps/ios/BruteForceHR.xcodeproj -scheme BruteForceHR \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  # The XCUITest accessibility audits on CI runners, in 3 shards (each builds once, then runs its
  # suites). macOS runners are limited to 5 concurrent jobs per account, so one runner per suite
  # queued for hours across PRs. They run the design-mode app (fixtures, no network), so they need
  # no secrets. Live end-to-end suites (*EndToEndTests) need a test account and stay local
  # (apps/ios/scripts/*-live-check.sh). New audit suites go into the lightest shard.
  ui-audits:
    name: UI audits (${{ matrix.shard }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: tracker-jobs
            suites: TodayAccessibilityAuditTests TrackerBoardAccessibilityAuditTests JobsAccessibilityAuditTests JobDetailAccessibilityAuditTests
          - shard: cv-mail-insights
            suites: CVEditorAccessibilityAuditTests InsightsAccessibilityAuditTests MailReviewAccessibilityAuditTests SettingsMailAccessibilityAuditTests
          - shard: account-share
            suites: DataPrivacyAccessibilityAuditTests ShareSheetAccessibilityAuditTests SignInAccessibilityAuditTests UpdateGateAccessibilityAuditTests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bfhr/cv-render build
      - name: Test ${{ matrix.shard }} (iPhone 17 Pro simulator, unsigned)
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          only=()
          for suite in $SUITES; do only+=("-only-testing:BruteForceHRUITests/$suite"); done
          xcodebuild test -project apps/ios/BruteForceHR.xcodeproj -scheme BruteForceHR \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/ui-audits.xcresult" \
            "${only[@]}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-audits-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-audits.xcresult
          retention-days: 14
