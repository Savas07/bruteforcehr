name: iOS

# BFHRUI (SwiftUI, macOS-only) and the app target. BFHRCore runs on Linux in ci.yml; this catches
# what that can't: UI-package compile/test failures and a broken app or Share Extension build.
# Path-filtered: macOS minutes count 10x on a private repo (docs/runbooks/release.md "Actions minutes").
on:
  push:
    branches: [main]
    paths: &ios-paths
      - apps/ios/**
      - packages/swift/**
      - packages/core/conformance/**
      - packages/fixtures/conformance/**
      - packages/cv-render/**
      - .github/workflows/ios.yml
  pull_request:
    paths: *ios-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  ios:
    name: BFHRUI (swift test) + app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version
      - run: swift test --package-path packages/swift/BFHRUI
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      # The app bundles cv-render's JavaScriptCore build (its Xcode phase fails if it's missing or stale).
      - run: pnpm --filter @bfhr/cv-render build
      - name: Build app + Share Extension (simulator, unsigned)
        run: |
          xcodebuild build -project apps/ios/BruteForceHR.xcodeproj -scheme BruteForceHR \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  # The XCUITest accessibility audits, one runner per suite (parallel). They run the design-mode
  # app (fixtures, no network), so they need no secrets. Live end-to-end suites (*EndToEndTests)
  # need a test account and stay local (apps/ios/scripts/*-live-check.sh).
  ui-audits:
    name: UI audit (${{ matrix.suite }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        suite:
          - CVEditorAccessibilityAuditTests
          - DataPrivacyAccessibilityAuditTests
          - InsightsAccessibilityAuditTests
          - JobDetailAccessibilityAuditTests
          - JobsAccessibilityAuditTests
          - MailReviewAccessibilityAuditTests
          - SettingsMailAccessibilityAuditTests
          - ShareSheetAccessibilityAuditTests
          - SignInAccessibilityAuditTests
          - TodayAccessibilityAuditTests
          - TrackerBoardAccessibilityAuditTests
          - UpdateGateAccessibilityAuditTests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bfhr/cv-render build
      - name: Test ${{ matrix.suite }} (iPhone 17 Pro simulator, unsigned)
        run: |
          xcodebuild test -project apps/ios/BruteForceHR.xcodeproj -scheme BruteForceHR \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/${{ matrix.suite }}.xcresult" \
            -only-testing:"BruteForceHRUITests/${{ matrix.suite }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-audit-${{ matrix.suite }}
          path: ${{ runner.temp }}/${{ matrix.suite }}.xcresult
          retention-days: 14
