name: Version

# Changesets (docs/adr/0004-release-updates-signing.md §1): while changesets are pending, keep the
# "Version packages" PR up to date. When that PR is merged (no changesets left and the version
# has no tag yet), tag vX.Y.Z in this repo and start release.yml, which drafts and publishes the
# GitHub Release in the public releases repo. A tag pushed with GITHUB_TOKEN doesn't trigger
# workflows, hence the dispatch.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: version
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  version:
    name: Version PR or release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commit, tag
      pull-requests: write # "Version packages" PR
      actions: write # dispatch release.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile

      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

      - name: Tag, start release.yml
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          tag="v$version"
          if [ "$version" = 0.0.0 ]; then
            echo "No release yet (version 0.0.0)."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists; nothing to release."
            exit 0
          fi
          # Fails before tagging if the version isn't a valid release version.
          pnpm --filter @bfhr/release-scripts -s release-info --tag "$tag" --package ../../apps/desktop/package.json
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --ref "$tag" -f dry_run=false
          echo "::notice::Tagged $tag and started release.yml (it drafts and publishes the release in Savas07/bruteforcehr-releases)."
