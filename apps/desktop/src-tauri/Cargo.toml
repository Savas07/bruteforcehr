[package]
name = "bruteforcehr"
version = "0.0.0"
description = "BruteForceHR desktop app for macOS and Windows"
authors = ["Savas07"]
edition = "2024"
rust-version = "1.99"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
url = "2.5.8"
# Test-only (feature `e2e`): WebdriverIO execute/log bridge. Never part of release bundles.
tauri-plugin-wdio = { version = "1.5.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Test-only (feature `e2e`): embedded WebDriver server; macOS has no WKWebView driver.
tauri-plugin-wdio-webdriver = { version = "1.5.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1.7"

[features]
# Builds the app for WebdriverIO (`pnpm build:e2e`); see tauri.e2e.conf.json.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
