    <meta name="title" property="og:title" content="Engineering Manager, Graphics System Software">
    <meta name="description" property="og:description" content="NVIDIA’s graphics software powers applications that help people design, create, and explore. We are looking for an engineering manager to lead a team developing workstation graphics and system software across graphics, APIs and operating systems. In this role, you’ll combine technical leadership with people management to guide enablement on new GPU architectures, core driver development, and improvements in performance and reliability. Partnering with engineers across hardware and software, you’ll help deliver the graphics foundation used by developers and customers around the world. What you’ll be doing: Lead and develop a team responsible for graphics driver development and enablement on new GPU architectures, building technical depth through mentoring, hiring, and career development. Guide the design, implementation, optimization, and validation of driver features, from early hardware bring-up through production release. Partner with GPU architecture, hardware, compiler, platform software, and quality engineering teams to define requirements, resolve dependencies, and deliver robust graphics capabilities. Drive investigation and resolution of complex correctness, performance, and stability issues across the graphics software and hardware stack. Set technical priorities and execution plans, balancing hardware enablement, feature development, performance improvements, and long-term software maintainability. Advance engineering practices through automated validation and AI-assisted development, guiding engineers in delegating work to coding agents and reviewing their output for correctness, quality, and maintainability. What we need to see: Bachelor’s or master’s degree in Computer Science, Computer Engineering, or a related field, or equivalent experience. 8+ overall years of relevant industry experience, including 3+ years of software engineering management experience delivering complex system software. Strong understanding of computer architecture, operating system fundamentals, and hardware–software interactions. Background in graphics drivers, graphics runtimes, or GPU system software, with an understanding of graphics pipelines and one or more APIs such as Vulkan, OpenGL, DirectX, or Metal. Strong C/C++ programming skills and the ability to guide debugging, design and code reviews, and technical decisions in a large software codebase. Demonstrated ability to develop engineers, establish team priorities, and manage multiple projects with competing requirements. Practical experience with AI-assisted development tools and coding agents, enthusiasm for evaluating new approaches, and a commitment to continuous learning. Clear communication and effective collaboration across geographically distributed engineering teams. Ways to stand out from the crowd: Deep knowledge of graphics driver architecture, state management, synchronization, memory management, or shader compilation. Experience enabling new GPU architectures through simulation, emulation, silicon bring-up, and production readiness. A record of improving graphics performance through profiling, workload analysis, and coordinated hardware and software optimization. Success leading cross-functional technical initiatives and improving the architecture, testability, or reliability of a large driver codebase. Experience developing workstation graphics or Linux graphics software across user-mode drivers, window-system integration, or related platform components. With competitive salaries and a generous benefits package (www.nvidiabenefits.com ), we are widely considered to be one of the technology world’s most desirable employers. We have some of the most forward-thinking and hardworking people in the world working for us and, due to outstanding growth, our best-in-class engineering teams are rapidly growing. If you&#39;re a creative and autonomous engineer with a real passion for technology, we want to hear from you! Your base salary will be determined based on your location, experience, and the pay of employees in similar positions. The base salary range is 224,000 USD - 356,500 USD for Level 3, and 272,000 USD - 431,250 USD for Level 4. You will also be eligible for equity and benefits. Applications for this job will be accepted at least until October 27, 2026. This posting is for an existing vacancy. NVIDIA uses AI tools in its recruiting processes. NVIDIA is committed to fostering an inclusive work environment and proud to be an equal opportunity employer. As we highly value diversity in our current and future employees, we do not discriminate (including in our hiring and promotion practices) on the basis of race, religion, color, national origin, gender, gender expression, sexual orientation, age, marital status, veteran status, disability status or any other characteristic protected by law. NVIDIA pioneered accelerated computing. Today, our AI infrastructure powers global intelligence, transforming every industry. Learn more about NVIDIA.">
