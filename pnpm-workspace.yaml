packages:
  - apps/*
  - packages/*
  - firebase/tests
  - scripts/release

# Install scripts are opt-in. esbuild needs its postinstall (binary check). Optional, skipped:
# protobufjs version check, @firebase/util web-config autoinit, re2 native regex for firebase-tools,
# and the edgedriver/geckodriver driver downloads pulled in by WebdriverIO (the desktop E2E needs
# neither: the app embeds its own WebDriver server, tauri-plugin-wdio-webdriver).
allowBuilds:
  "@firebase/util": false
  edgedriver: false
  esbuild: true
  geckodriver: false
  protobufjs: false
  re2: false

# The Firebase web SDK pins @grpc/grpc-js ~1.9 for its Node build (never in the desktop webview
# bundle); 1.9.x has GHSA-m9gg-hp2v-232j, fixed only in >=1.13.6. Same major, API-compatible.
overrides:
  "@firebase/firestore>@grpc/grpc-js": "^1.14.6"
